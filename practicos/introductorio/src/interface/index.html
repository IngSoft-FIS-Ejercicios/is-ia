<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Movie Tracker - Práctico</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container-fluid">
      <span class="navbar-brand mb-0 h1">Movie Tracker</span>
    </div>
  </nav>

  <main class="container">
    <div class="row mb-4">
      <div class="col-12">
        <form id="movie-form" class="row g-2">
          <div class="col-12 col-md-4">
            <input type="text" id="title" class="form-control" placeholder="Título" required>
          </div>
          <div class="col-6 col-md-2">
            <input type="text" id="year" class="form-control" placeholder="Año">
          </div>
          <div class="col-12 col-md-4">
            <input type="url" id="poster" class="form-control" placeholder="URL de imagen (opcional)">
          </div>
          <div class="col-12 col-md-2 d-grid">
            <button class="btn btn-primary" type="submit">Agregar</button>
          </div>
        </form>
      </div>
    </div>

    <div id="movies" class="row gy-3"></div>
  </main>

  <script src="../domain/Movie.js"></script>
  <script src="../domain/movies.js"></script>
  <script src="ui.js"></script>
  <script src="../app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
